services:
  nexus:
    image: sonatype/nexus3:3.68.1
    container_name: nexus
    networks: [cicd_network]
    ports:
      - "9181:8081"
      - "9180:8082"
    volumes:
      - nexus_data:/nexus-data
    environment:
      - INSTALL4J_ADD_VMPARAMS=-Xms2048m -Xmx2048m -XX:MaxDirectMemorySize=2048m
    deploy:
      resources:
        limits:
          memory: 4g
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/service/rest/v1/status >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 90s

networks:
  cicd_network:
    external: true

volumes:
  nexus_data: