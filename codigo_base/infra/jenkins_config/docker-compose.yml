services:
  jenkins:
    build: .
    container_name: jenkins
    networks:
      - cicd_network
    ports:
      - "9182:8080"
      - "50001:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"

  smee:
    build: ./smee
    container_name: smee-client
    environment:
      - SMEE_URL=${SMEE_URL}
      - SMEE_TARGET=http://jenkins:8080/github-webhook/
    networks:
      - cicd_network
    depends_on:
      - jenkins

networks:
  cicd_network:
    external: true

volumes:
  jenkins_home: